<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">

<title>distributed-bms</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 40px;
    font-family: system-ui;
    background: #f4f6f8;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    margin-top: 0;
}

#connection {
    font-weight: bold;
    margin-bottom: 25px;
}

.connected {
    color: green;
}

.disconnected {
    color: red;
}

.card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
}

.card h2 {
    margin-top: 0;
}

table {
    width: 100%;
    border-collapse: collapse;
}

td {
    padding: 6px;
    border-bottom: 1px solid #eee;
}

td:first-child {
    color: #666;
}

.value {
    text-align: right;
    font-weight: bold;
}

</style>

</head>

<body>

<div class="container">

<h1 id="system-name">Loading...</h1>

<div id="connection" class="disconnected">
Connecting...
</div>

<div id="latest"></div>

<div id="components"></div>

</div>

<script>
const interfaceName = 'cabinet-1';//'beckhoff-2';//'ems-esp';//
const systemName = 'beckhoff-1';//'ems-heating'; //

const values = {};
const rows = {};
const writable = {};

function updateTime (timestamp) {

  const c = document.getElementById("latest");
  c.textContent = timestamp;
}

function formatValue(value, units)
{
    if(value === null)
        return "--";

    if(typeof value === "number")
    {
        if(units)
            return value.toFixed(1) + " " + units;

        return value.toFixed(1);
    }

    return value;
}

async function getInterfaceConfig () 
{
    const response = await fetch(`/api/interfaces/${interfaceName}`);
    const interfaceConfig = await response.json();

    interfaceConfig.sources.forEach(source => {
        writable[source.id] = source.writable === true;
    });
}

async function loadSystem()
{
    const response = await fetch(`/api/systems/${systemName}`);
    const system = await response.json();

    document.getElementById("system-name").textContent = system.name;

    const container = document.getElementById("components");

/*        const title = document.createElement("h2");
        title.textContent = 'Status';
        card.appendChild(title);*/

    if (system.status) {
        const card = document.createElement("div");
        card.className = "card";

        const table = document.createElement("table");

        const tr = document.createElement("tr");

        const valueCell = document.createElement("td");
        valueCell.className = "value";
        valueCell.textContent = "--";

        tr.appendChild(document.createElement("td"))
            .textContent = 'Status';

        tr.appendChild(valueCell);

        table.appendChild(tr);

        card.appendChild(table);

        container.appendChild(card);

        rows[system.status.enabled.source] = {
            cell: valueCell,
            units: ""
        };

    }

    system.components.forEach(component => {

        const card = document.createElement("div");
        card.className = "card";

        const title = document.createElement("h2");
        title.textContent = component.name 
        if (component.role)  title.textContent += " (" + component.role + ")";

        card.appendChild(title);

        const table = document.createElement("table");

        for(const [pointName, point] of Object.entries(component.points))
        {
/*console.log(
    "POINT:",
    point.source,
    "WRITABLE:",
    writable[point.source]
);*/
            const tr = document.createElement("tr");

            const valueCell = document.createElement("td");
            valueCell.className = "value";

            let cellToUpdate = valueCell;

            if (writable[point.source]) {

                valueCell.innerHTML =
                    `<input
                    type="number"
                    step="0.1"
                    data-source="${point.source}"
                    style="width:80px">`;

                const input = valueCell.firstElementChild;

                cellToUpdate = input;

                input.onchange = async () => {

                    let res = await fetch(`/api/interfaces/${interfaceName}/write`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            source: point.source,
                            value: Number(input.value)
                        })
                    });

                    if (res.status > 299) {
                      let msg = await res.json();
                      alert ('Error: ' + msg.error);
                    }
                };
            }
            else {

                valueCell.textContent = "--";
            }

            tr.appendChild(document.createElement("td"))
                .textContent = point.label ?? pointName;

            tr.appendChild(valueCell);

            table.appendChild(tr);

            rows[point.source] = {
                cell: cellToUpdate,
                units: point.units ?? ""
            };
        }

        card.appendChild(table);

        container.appendChild(card);

    });
}

function connect()
{
    const sse =
        new EventSource(`/api/interfaces/${interfaceName}/get-sources`);

    sse.onopen = () => {

        const c = document.getElementById("connection");

        c.className = "connected";
        c.textContent = "Connected";

    };

    sse.onerror = () => {

        const c = document.getElementById("connection");

        c.className = "disconnected";
        c.textContent = "Disconnected";

    };

    sse.onmessage = e => {

        const event = JSON.parse(e.data);

//console.log ('data')
//console.log (event)
        for(const [source,value] of Object.entries(event.sources))
        {
            const row = rows[source];

            if(!row)
                continue;

            if (row.cell.tagName === "INPUT")
                row.cell.value = value;
            else
                row.cell.textContent = formatValue(value, row.units);
        }
        updateTime (event.timestamp);
    };
}

async function start()
{
    try {
        await getInterfaceConfig();
        await loadSystem();
        connect();
    }
    catch (e) {
        alert("Error: " + e.toString());
    }
}

start();

</script>

</body>
</html>
